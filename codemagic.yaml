workflows:
  ios-build:
    name: iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.38.1
      xcode: latest
      cocoapods: default
      vars:
        MAPS_LITE_MODE: "false"
        BUNDLE_ID: "com.thehero.app"
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Prepare iOS runtime config
        script: |
          set -euo pipefail
          GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}"

          python3 - <<'PY'
          import os
          import plistlib

          path = "ios/Runner/Info.plist"
          with open(path, "rb") as file:
              plist = plistlib.load(file)
          plist["API_KEY"] = os.environ.get("GOOGLE_MAPS_API_KEY", "")
          with open(path, "wb") as file:
              plistlib.dump(plist, file)
          PY
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Reset iOS pods
        script: |
          set -euo pipefail
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
      - name: Install iOS pods
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update
      - name: Build and archive IPA
        script: |
          set -euo pipefail
          BUILD_NAME="${BUILD_NAME:-1.0.0}"
          BUILD_NUMBER="${BUILD_NUMBER:-${CM_BUILD_NUMBER:-25}}"

          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY:-}" \
            --dart-define=PLACES_API_KEY="${PLACES_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}" \
            --dart-define=GOOGLE_DIRECTIONS_API_KEY="${GOOGLE_DIRECTIONS_API_KEY:-${GOOGLE_MAPS_API_KEY:-}}" \
            --dart-define=MAPS_LITE_MODE="${MAPS_LITE_MODE:-false}"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
